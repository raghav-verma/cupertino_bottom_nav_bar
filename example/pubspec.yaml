name: glass_navigation_dock_example
description: Controlled-selection Flutter example for the liquid glass navigation dock.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  cupertino_bottom_nav_bar:
    path: ../
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
